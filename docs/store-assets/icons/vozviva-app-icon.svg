<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="VozViva — Plataforma de Comunicação e Desenvolvimento Assistivo (CAA)">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="55%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cardShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F5F0"/>
    </linearGradient>
  </defs>

  <!-- 100% Opaque Background (Calm & Clear Studio Royal Cobalt) -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>

  <!-- Subtle Inner Frame -->
  <rect x="44" y="44" width="936" height="936" rx="210" fill="none" stroke="#3B82F6" stroke-width="6" stroke-opacity="0.35"/>

  <!-- Main Speech Bubble Container (Warm Daylight #F6F5F0) -->
  <path d="M180 184 h520 a84 84 0 0 1 84 84 v360 a84 84 0 0 1 -84 84 h-270 l-136 116 v-116 h-114 a84 84 0 0 1 -84 -84 v-360 a84 84 0 0 1 84 -84 z"
        fill="url(#cardShadow)" stroke="#93C5FD" stroke-width="8"/>

  <!-- 2x2 Modified Fitzgerald Key CAA Grid inside Speech Bubble -->
  <!-- Card 1: People (Amber #D97706, Circle ●) -->
  <g transform="translate(220, 224)">
    <rect width="208" height="172" rx="28" fill="#FEF3C7" stroke="#D97706" stroke-width="10"/>
    <circle cx="38" cy="36" r="13" fill="#D97706"/>
    <circle cx="104" cy="78" r="24" fill="#B45309"/>
    <path d="M64 138 c0 -24 80 -24 80 0" fill="#B45309"/>
  </g>

  <!-- Card 2: Verbs/Actions (Emerald #059669, Triangle ▶) -->
  <g transform="translate(452, 224)">
    <rect width="208" height="172" rx="28" fill="#DCFCE7" stroke="#059669" stroke-width="10"/>
    <polygon points="28,24 52,36 28,48" fill="#059669"/>
    <path d="M68 92 h72 m-24 -24 l26 24 l-26 24" fill="none" stroke="#047857" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Card 3: Nouns/Objects (Terracotta Orange #EA580C, Square ■) -->
  <g transform="translate(220, 418)">
    <rect width="208" height="172" rx="28" fill="#FFEDD5" stroke="#EA580C" stroke-width="10"/>
    <rect x="26" y="24" width="24" height="24" rx="4" fill="#EA580C"/>
    <!-- Apple / Cup symbol -->
    <circle cx="104" cy="100" r="34" fill="#C2410C"/>
    <path d="M104 62 c8 -16 24 -16 28 -8" fill="none" stroke="#15803D" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Card 4: Emotions/Feelings (Cobalt Blue #2563EB, Diamond ◆) -->
  <g transform="translate(452, 418)">
    <rect width="208" height="172" rx="28" fill="#DBEAFE" stroke="#2563EB" stroke-width="10"/>
    <polygon points="38,20 54,36 38,52 22,36" fill="#2563EB"/>
    <!-- Warm smile face -->
    <circle cx="88" cy="84" r="8" fill="#1D4ED8"/>
    <circle cx="120" cy="84" r="8" fill="#1D4ED8"/>
    <path d="M78 110 q26 24 52 0" fill="none" stroke="#1D4ED8" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Acoustic Sound Waves (Speak Action Emerald #10B981 & Warm Amber #FBBF24) -->
  <path d="M826 346 a150 150 0 0 1 0 204" fill="none" stroke="#34D399" stroke-width="26" stroke-linecap="round"/>
  <path d="M884 288 a230 230 0 0 1 0 320" fill="none" stroke="#10B981" stroke-width="26" stroke-linecap="round"/>
  <path d="M942 230 a310 310 0 0 1 0 436" fill="none" stroke="#FBBF24" stroke-width="22" stroke-linecap="round"/>

  <!-- Bottom Brand Pill Badge -->
  <rect x="520" y="768" width="384" height="96" rx="48" fill="#047857" stroke="#6EE7B7" stroke-width="6"/>
  <circle cx="582" cy="816" r="18" fill="#FFFFFF"/>
  <path d="M612 798 a26 26 0 0 1 0 36" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <text x="646" y="831" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="1">VOZVIVA</text>
</svg>
